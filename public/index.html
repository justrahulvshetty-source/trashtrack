<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TrashTrack</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',sans-serif;background:#0a0a0c;color:#d4d4d8;min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px}
h1{font-size:clamp(32px,6vw,48px);font-weight:800;color:#fafafa;margin-bottom:16px}
h1 span{color:#00D084}
p{font-size:16px;color:#71717a;margin-bottom:32px;max-width:400px;line-height:1.6}
.links{display:flex;flex-direction:column;gap:12px;max-width:300px;margin:0 auto}
a{display:block;padding:14px;background:#111114;border:1px solid rgba(255,255,255,.06);border-radius:12px;color:#d4d4d8;text-decoration:none;font-size:14px;font-weight:600;transition:all .2s}
a:hover{border-color:rgba(0,208,132,.2);color:#00D084}
</style>
</head>
<body>
<div>
<h1>Trash<span>Track</span></h1>
<p>BBMP garbage truck tracking for Bangalore. Real-time alerts via WhatsApp.</p>
<div class="links">
<a href="/admin">Admin Dashboard</a>
<a href="/subscribe">Subscribe to a Truck</a>
<a href="/track">Track a Truck</a>
</div>
</div>
</body>
</html>
